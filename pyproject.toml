[project]
name = "preached"
version = "0.1.0"
description = "Search a sermon archive and return the preacher's own words."
readme = "README.md"
authors = [
    { name = "Patrick Shouse", email = "shouse.patrick@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.1",
    "pillow>=10",
    "sentence-transformers>=6.1.0",
    "torch>=2.5",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
