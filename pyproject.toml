[project]
name = "preached"
version = "0.1.0"
description = "Search a sermon archive and return the preacher's own words."
readme = "README.md"
authors = [
    { name = "Patrick Shouse", email = "shouse.patrick@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.1",
    "pillow>=10",
    "sentence-transformers>=6.1.0",
    "torch>=2.5",
    "torchvision>=0.29.2",
    # Channel listing and audio download. The stdlib cannot speak YouTube's player.
    "yt-dlp==2026.10.26",
]

[project.optional-dependencies]
# Same pins as W1-A. Not installed for the search server. CPU fallback uses
# tiny.en; the GPU path uses the cached large-v3-turbo weights.
transcribe = [
    "faster-whisper>=1.2.1,<1.3",
    "av>=18.1,<19",
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9,<10",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
