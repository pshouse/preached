[project]
name = "preached"
version = "0.1.0"
description = "Search a sermon archive and return the preacher's own words."
readme = "README.md"
authors = [
    { name = "Patrick Shouse", email = "shouse.patrick@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]

[project.optional-dependencies]
# Offline transcription on a CUDA GPU only; not needed by the search app.
# Use: uv run --extra transcribe ingest/run.py --all
transcribe = [
    "faster-whisper>=1.2.1,<1.3",
    # faster-whisper 1.2.1 passes av.open(metadata_errors=...), removed in av 19.
    "av>=18.1,<19",
    # CTranslate2 loads CUDA 12 cuBLAS/cuDNN 9 at runtime; the box has no system CUDA.
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9,<10",
]
# Channel listing and audio download. The stdlib cannot speak YouTube's player.
youtube = ["yt-dlp==2026.10.26"]

[dependency-groups]
# Opt-in. The server and search/query.py do not install this group.
# EmbeddingGemma 2 builds image/video processors even for a text-only load,
# so Pillow and torchvision stay here. einops left with Nomic (excluded)
# and is not re-added. Torch resolves from PyPI (CUDA build). A CPU wheel
# is a separate venv; see reports/W3-CPU.md.
#   uv sync
#   uv run app/server.py
#   uv run --group bench search/bench.py
#   uv run --group bench python scripts/export_onnx.py
bench = [
    "onnx>=1.17",
    "onnxscript>=0.3",
    "pillow>=10",
    "sentence-transformers>=6.1.0",
    "torch>=2.5",
    "torchvision>=0.29.2",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
